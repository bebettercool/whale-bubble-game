<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼接泡泡</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a2a;overflow:hidden;
    font-family:"Microsoft YaHei",system-ui,sans-serif;color:#dff1ff;
    user-select:none;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{background:linear-gradient(#0e2b45,#0b1a2a 70%,#07131f);border-radius:12px;
    box-shadow:0 0 40px #1e6fa855;max-width:100%;max-height:100%;cursor:default}
  #hint{position:absolute;bottom:10px;font-size:13px;opacity:.55}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="720" height="520"></canvas>
  <div id="hint">鼠标 或 ← → 挪动 · 空格 / P 暂停 · Enter 重开</div>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

const ROUND_TIME = 45;

// phase: 'ready' | 'playing' | 'paused' | 'over'
const state = {
  x: W/2, y: H - 62, tx: W/2, t: 0,
  score: 0, lives: 3, time: ROUND_TIME,
  items: [], pops: [],
  bubbles: [],
  phase: 'ready',
  best: +(localStorage.getItem('whaleBest') || 0)
};

// 背景小气泡
for (let i=0;i<40;i++) state.bubbles.push({
  x: Math.random()*W, y: Math.random()*H,
  r: 1+Math.random()*3, s: .2+Math.random()*.6
});

// 按钮:坐标 + 尺寸,和 canvas 一起画
const buttons = {
  start:  {x: W/2-90, y: H/2-4,  w: 180, h: 52, label: '开始游戏'},
  again:  {x: W/2-90, y: H/2+22, w: 180, h: 52, label: '再来一局'},
  resume: {x: W/2-80, y: H/2+16, w: 160, h: 48, label: '继续'},
  pause:  {x: W-104, y: 16, w: 88, h: 34, label: '暂停'}
};

let hot = null; // 鼠标悬停的按钮

const TYPES = {
  coin:  {r:14, score:10, good:true,  color:'#ffd36e'},
  fish:  {r:13, score:25, good:true,  color:'#8ee6ff'},
  jelly: {r:16, score:0,  good:false, color:'#c98bff'}
};

let keys = {};

function startRound(){
  state.score = 0; state.lives = 3; state.time = ROUND_TIME;
  state.items = []; state.pops = [];
  state.x = state.tx = W/2;
  state.t = 0; spawnTimer = 0;
  state.phase = 'playing';
}
function togglePause(){
  if (state.phase === 'playing') state.phase = 'paused';
  else if (state.phase === 'paused') state.phase = 'playing';
}

addEventListener('keydown', e=>{
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'p' || e.key === 'P'){
    if (state.phase === 'playing' || state.phase === 'paused') togglePause();
    else if (state.phase === 'ready') startRound();
    e.preventDefault();
  }
  if (e.key === 'Enter'){
    if (state.phase === 'ready' || state.phase === 'over') startRound();
  }
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e=> keys[e.key] = false);

function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height)};
}
function hitButton(p){
  for (const k in buttons){
    const b = buttons[k];
    if (visibleButton(k) && p.x >= b.x && p.x <= b.x+b.w && p.y >= b.y && p.y <= b.y+b.h) return k;
  }
  return null;
}
function visibleButton(k){
  if (k === 'start')  return state.phase === 'ready';
  if (k === 'again')  return state.phase === 'over';
  if (k === 'resume') return state.phase === 'paused';
  if (k === 'pause')  return state.phase === 'playing' || state.phase === 'paused';
  return false;
}

cv.addEventListener('mousemove', e=>{
  const p = canvasPos(e);
  hot = hitButton(p);
  cv.style.cursor = hot ? 'pointer' : 'default';
  if (state.phase === 'playing') state.tx = p.x;
});
cv.addEventListener('mousedown', e=>{
  if (e.button !== 0) return;
  const k = hitButton(canvasPos(e));
  if (!k) return;
  if (k === 'start' || k === 'again') startRound();
  else if (k === 'resume') state.phase = 'playing';
  else if (k === 'pause') togglePause();
  e.preventDefault();
});
cv.addEventListener('touchstart', e=>{
  const r = cv.getBoundingClientRect();
  const p = {x: (e.touches[0].clientX - r.left) * (W / r.width), y: (e.touches[0].clientY - r.top) * (H / r.height)};
  const k = hitButton(p);
  if (k === 'start' || k === 'again' || k === 'resume') { startRound(); }
  else if (k === 'pause') { togglePause(); }
  else if (state.phase === 'playing') state.tx = p.x;
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  if (state.phase !== 'playing') return;
  const r = cv.getBoundingClientRect();
  state.tx = (e.touches[0].clientX - r.left) * (W / r.width);
  e.preventDefault();
}, {passive:false});

function spawn(){
  const roll = Math.random();
  let type = 'coin';
  if (roll > .82) type = 'jelly';
  else if (roll > .58) type = 'fish';
  const T = TYPES[type];
  state.items.push({
    type, x: 40 + Math.random()*(W-80), y: -30,
    vy: 70 + Math.random()*70 + state.score*0.25,
    r: T.r, spin: Math.random()*6.28
  });
}

function pop(x, y, text, color){
  state.pops.push({x, y, text, color, life:1});
}

function gameOver(){
  state.phase = 'over';
  if (state.score > state.best){
    state.best = state.score;
    localStorage.setItem('whaleBest', state.best);
  }
}

let spawnTimer = 0;

function step(dt){
  if (state.phase !== 'playing') return;

  state.t += dt;
  state.time -= dt;
  if (state.time <= 0){ state.time = 0; gameOver(); return; }

  if (keys['ArrowLeft']) state.tx -= 420*dt;
  if (keys['ArrowRight']) state.tx += 420*dt;
  state.tx = Math.max(40, Math.min(W-40, state.tx));
  state.x += (state.tx - state.x) * Math.min(1, 12*dt);

  spawnTimer -= dt;
  if (spawnTimer <= 0){
    spawnTimer = Math.max(0.22, 0.65 - state.score*0.002);
    spawn();
  }

  for (let i=state.items.length-1;i>=0;i--){
    const it = state.items[i];
    it.y += it.vy*dt;
    it.spin += dt*3;
    const dx = it.x - state.x, dy = it.y - (state.y - 8);
    if (Math.hypot(dx, dy) < it.r + 26){
      const T = TYPES[it.type];
      if (T.good){
        state.score += T.score;
        pop(it.x, it.y, '+'+T.score, '#9ff5c8');
      } else {
        state.lives--;
        pop(it.x, it.y, '哎呀!', '#ff9db0');
        if (state.lives <= 0) gameOver();
      }
      state.items.splice(i,1);
      continue;
    }
    if (it.y > H+40) state.items.splice(i,1);
  }

  for (let i=state.pops.length-1;i>=0;i--){
    const p = state.pops[i];
    p.life -= dt*1.4; p.y -= 40*dt;
    if (p.life <= 0) state.pops.splice(i,1);
  }
}

function drawWhale(x, y){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#2f7fc4';
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.quadraticCurveTo(-34, 2, -44, -14);
  ctx.quadraticCurveTo(-30, -8, -22, 4);
  ctx.quadraticCurveTo(-14, 14, 0, 16);
  ctx.fill();
  const g = ctx.createLinearGradient(0,-26,0,20);
  g.addColorStop(0,'#7fd0ff'); g.addColorStop(1,'#2b6faa');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 24, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(240,250,255,.75)';
  ctx.beginPath(); ctx.ellipse(2, 9, 21, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5fb6ea';
  ctx.beginPath(); ctx.ellipse(-8, 12, 11, 6, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3b7fbf';
  ctx.beginPath(); ctx.ellipse(-4, -18, 22, 12, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3b7fbf'; ctx.lineWidth = 3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-2, -28); ctx.quadraticCurveTo(6, -40, 12, -30); ctx.stroke();
  ctx.fillStyle = '#12314a';
  ctx.beginPath(); ctx.arc(8, -4, 3.4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-4, -4, 3.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(9.2, -5.2, 1.1, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-2.8, -5.2, 1.1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#12314a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(2, 2, 5, 0.2, Math.PI-0.2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,150,170,.45)';
  ctx.beginPath(); ctx.arc(-10, 3, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(14, 3, 4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawItem(it){
  const T = TYPES[it.type];
  if (it.type === 'coin'){
    ctx.fillStyle = '#ffd36e';
    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, 7); ctx.fill();
    ctx.fillStyle = '#b8860b';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('¥', it.x, it.y+1);
  } else if (it.type === 'fish'){
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.fillStyle = T.color;
    ctx.beginPath(); ctx.ellipse(0,0,it.r,it.r*0.62,0,0,7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-it.r,0); ctx.lineTo(-it.r-8,-7); ctx.lineTo(-it.r-8,7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#12314a';
    ctx.beginPath(); ctx.arc(5,-3,1.8,0,7); ctx.fill();
    ctx.restore();
  } else {
    ctx.save(); ctx.translate(it.x, it.y);
    ctx.fillStyle = 'rgba(201,139,255,.85)';
    ctx.beginPath(); ctx.arc(0,-2,it.r*0.8,Math.PI,0); ctx.fill();
    ctx.strokeStyle = 'rgba(201,139,255,.85)'; ctx.lineWidth = 2.5;
    for (let i=-1;i<=1;i++){
      ctx.beginPath();
      ctx.moveTo(i*7, 6);
      ctx.quadraticCurveTo(i*10+Math.sin(it.spin)*4, 16, i*6, 24);
      ctx.stroke();
    }
    ctx.fillStyle = '#12314a';
    ctx.beginPath(); ctx.arc(-4,-4,1.6,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(4,-4,1.6,0,7); ctx.fill();
    ctx.restore();
  }
}

function drawButton(b){
  const isHot = hot && buttons[hot] === b;
  ctx.fillStyle = isHot ? '#3f8fd0' : '#2a6aa0';
  ctx.strokeStyle = 'rgba(200,235,255,.75)'; ctx.lineWidth = 2;
  const r = 10;
  ctx.beginPath();
  ctx.moveTo(b.x+r, b.y);
  ctx.arcTo(b.x+b.w, b.y, b.x+b.w, b.y+b.h, r);
  ctx.arcTo(b.x+b.w, b.y+b.h, b.x, b.y+b.h, r);
  ctx.arcTo(b.x, b.y+b.h, b.x, b.y, r);
  ctx.arcTo(b.x, b.y, b.x+b.w, b.y, r);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#eaf6ff';
  ctx.font = 'bold 19px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle = 'rgba(160,220,255,.12)';
  for (const b of state.bubbles){
    if (state.phase === 'playing'){
      b.y -= b.s*20/60;
      if (b.y < -10){ b.y = H+10; b.x = Math.random()*W; }
    }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(60,180,150,.35)'; ctx.lineWidth = 5;
  for (let i=0;i<7;i++){
    const bx = 50 + i*100;
    ctx.beginPath();
    ctx.moveTo(bx, H);
    ctx.quadraticCurveTo(bx + Math.sin(state.t*1.2 + i)*18, H-45, bx + Math.sin(state.t + i)*10, H-90);
    ctx.stroke();
  }

  state.items.forEach(drawItem);
  drawWhale(state.x, state.y);

  for (const p of state.pops){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 18px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  // HUD
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#dff1ff';
  ctx.font = 'bold 20px "Microsoft YaHei",sans-serif';
  ctx.fillText('得分 ' + state.score, 18, 32);
  ctx.font = '15px "Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(223,241,255,.7)';
  ctx.fillText('最好 ' + state.best, 18, 56);
  ctx.textAlign = 'right';
  ctx.fillText('时间 ' + Math.ceil(state.time) + 's', W-118, 32);
  ctx.fillText('♥'.repeat(Math.max(0,state.lives)), W-118, 56);

  // 开始页
  if (state.phase === 'ready'){
    ctx.fillStyle = 'rgba(6,18,30,.55)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#dff1ff'; ctx.textAlign='center';
    ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
    ctx.fillText('大肥鱼接泡泡', W/2, H/2-92);
    ctx.font = '16px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(223,241,255,.8)';
    ctx.fillText('接金币 +10 · 接小鱼干 +25 · 躲开水母', W/2, H/2-54);
    ctx.fillText('一局 ' + ROUND_TIME + ' 秒,掉光三颗心就结束', W/2, H/2-30);
    drawButton(buttons.start);
  }

  // 暂停
  if (state.phase === 'paused'){
    ctx.fillStyle = 'rgba(6,18,30,.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#dff1ff'; ctx.textAlign='center';
    ctx.font = 'bold 30px "Microsoft YaHei",sans-serif';
    ctx.fillText('暂停中', W/2, H/2-24);
    ctx.font = '15px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(223,241,255,.75)';
    ctx.fillText('空格或 P 继续', W/2, H/2-2);
    drawButton(buttons.resume);
  }

  // 结束
  if (state.phase === 'over'){
    ctx.fillStyle = 'rgba(6,18,30,.68)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#dff1ff'; ctx.textAlign='center';
    ctx.font = 'bold 34px "Microsoft YaHei",sans-serif';
    ctx.fillText('时间到啦', W/2, H/2-70);
    ctx.font = 'bold 22px "Microsoft YaHei",sans-serif';
    ctx.fillText('得分 ' + state.score + ' / 最好 ' + state.best, W/2, H/2-30);
    drawButton(buttons.again);
    ctx.font = '15px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(223,241,255,.7)';
    ctx.fillText('也可以按 Enter 再来一次', W/2, H/2+96);
  }

  // 暂停按钮最后画,免得被遮罩压暗
  if (visibleButton('pause')) drawButton(buttons.pause);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
